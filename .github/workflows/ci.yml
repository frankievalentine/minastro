name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    # Pinned to a fixed LTS image instead of ubuntu-latest, which GitHub is
    # migrating to Ubuntu 26 on 2026-10-19. Move to ubuntu-26.04 when ready.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate seed
        run: bun run seed:validate

      - name: Verify generated type artifacts
        run: |
          bun run types:generate
          git diff --exit-code -- .emdash/types.ts .emdash/schema.json

      - name: Run tests
        run: bun test

      - name: Type-check and lint
        run: bun run check

      - name: Build
        run: bun run build

      - name: Audit dependencies
        run: bun audit --json

      - name: Smoke-test local Worker
        run: bun run smoke:worker

      - name: Check diff hygiene
        run: git diff --check
